name: SonarQube

# Opt-in static analysis. This repo is configuration and scripts only (no
# package.json / lockfile), so no pnpm/npm install step is needed. Enable the
# scan per repository by setting the Actions variable ENABLE_SONARQUBE to
# "true" (Settings → Secrets and variables → Actions → Variables). The scan also
# needs the SONAR_HOST_URL, SONAR_TOKEN secrets and a SONAR_PROJECT_KEY variable.
on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

jobs:
  sonarqube:
    if: vars.ENABLE_SONARQUBE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
