name: PR Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id AND check-run name stay `typecheck` for branch-protection
  # compatibility. This repo is config/docs/shell only (no package.json), so it
  # validates the tracked configuration and installer instead of TypeScript.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tracked JSON config
        run: |
          set -euo pipefail
          for f in \
            opencode-config/opencode.json \
            opencode-config/opencode.jsonc \
            opencode-config/tui.json \
            oh-my-opencode-slim.json; do
            echo "validating ${f}"
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "${f}"
          done

      - name: Check plugin JavaScript syntax
        run: node --check opencode-config/plugins/commandcode-model-sync.js

      - name: Check shell syntax
        run: |
          set -euo pipefail
          bash -n scripts/install-workflow.sh
          bash -n scripts/install-workflow.test.sh

      - name: ShellCheck installer scripts
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck scripts/install-workflow.sh scripts/install-workflow.test.sh

      - name: Installer regression tests
        run: bash scripts/install-workflow.test.sh

      - name: CI review helper tests
        run: node scripts/ci-review.test.js

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Codemap skill tests
        run: bun test opencode-config/skills/codemap/scripts/codemap.test.ts

  review:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    outputs:
      has_bugs: ${{ steps.check.outputs.has_bugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Refuse to review a stale checkout: the live PR head must still match the
      # head SHA this workflow event was created for.
      - name: Fail stale review run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LIVE_HEAD=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "${LIVE_HEAD}" != "${EVENT_HEAD_SHA}" ]; then
            echo "::error::PR head ${LIVE_HEAD} does not match event head ${EVENT_HEAD_SHA} — refusing stale review"
            exit 1
          fi

      # The action posts its result as an issue comment, so record the newest
      # existing comment id to distinguish this run's review from earlier ones.
      - name: Record review baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_ID=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            | jq '[.[][]] | map(.id) | max // 0')
          echo "last_comment_id=${LAST_ID:-0}" >> "$GITHUB_OUTPUT"

      - name: AI Code Review
        id: ai-review
        uses: anomalyco/opencode/github@v1.17.8
        env:
          # Optional: only needed for paid/authenticated models. The free model
          # used below works without it.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          share: "false"
          prompt: |
            Review this pull request.

            Read the diff and changed files. Check for:
            - Bugs and logic errors
            - Security vulnerabilities
            - Missing error handling

            Be conservative — only flag things you're 90%+ sure about.
            Skip style, formatting, and naming nits.
            Write findings as file:line references.

            Finish with a final line that is EXACTLY one of the two strings
            below, with nothing before or after it on that line. Do not put any
            explanation on that line.

            VERDICT: PASS

            or

            VERDICT: FAIL

            Use VERDICT: PASS only when there are no blocking bugs or security
            issues. Use VERDICT: FAIL when at least one blocking issue exists.

      - name: Check review verdict
        id: check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASELINE_ID: ${{ steps.baseline.outputs.last_comment_id }}
          EXPECTED_FOOTER: '[github run](/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION_OUTCOME: ${{ steps.ai-review.outcome }}
        run: |
          set -euo pipefail

          # A failed or cancelled review action must never be overridden by a
          # comment that happens to say PASS.
          if [ "${ACTION_OUTCOME}" != "success" ]; then
            echo "::error::AI review action outcome '${ACTION_OUTCOME}' — refusing any comment"
            echo "has_bugs=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # The live PR head must still match the event head at acceptance time.
          LIVE_HEAD=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "${LIVE_HEAD}" != "${EVENT_HEAD_SHA}" ]; then
            echo "::error::PR head moved (event ${EVENT_HEAD_SHA}, live ${LIVE_HEAD}) — refusing stale result"
            echo "has_bugs=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          VERDICT=""
          for i in $(seq 1 12); do
            COMMENTS=$(gh api --paginate --slurp \
              "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")
            set +e
            VERDICT=$(printf '%s' "$COMMENTS" | node scripts/ci-review.js 2>"${RUNNER_TEMP}/ci-review.err")
            RC=$?
            set -e
            if [ "${RC}" -eq 0 ]; then
              break
            fi
            if [ "${RC}" -eq 1 ]; then
              echo "::error::$(cat "${RUNNER_TEMP}/ci-review.err")"
              echo "has_bugs=unknown" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "Waiting for review comment... (attempt ${i}/12)"
            sleep 5
          done

          if [ -z "${VERDICT}" ]; then
            echo "::error::No AI review comment matched this run"
            echo "has_bugs=unknown" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          case "${VERDICT}" in
            PASS)
              echo "has_bugs=false" >> "$GITHUB_OUTPUT"
              echo "AI review verdict: PASS"
              ;;
            FAIL)
              echo "has_bugs=true" >> "$GITHUB_OUTPUT"
              echo "::error::AI review verdict: FAIL"
              exit 1
              ;;
            *)
              echo "has_bugs=unknown" >> "$GITHUB_OUTPUT"
              echo "::error::Unexpected verdict output: ${VERDICT}"
              exit 1
              ;;
          esac

  gate:
    needs: [typecheck, review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Typecheck must pass
        if: needs.typecheck.result != 'success'
        run: |
          echo "::error::Config/installer validation did not succeed (result: ${{ needs.typecheck.result }})"
          exit 1

      - name: AI review must complete
        if: needs.review.result != 'success' && needs.review.result != 'skipped'
        run: |
          echo "::error::AI review did not complete (result: ${{ needs.review.result }})"
          exit 1

      - name: AI review must not report blocking issues
        if: needs.review.result == 'success' && needs.review.outputs.has_bugs == 'true'
        run: |
          echo "::error::AI review reported blocking issues"
          exit 1

      - name: All checks passed
        run: echo "✅ Config, installer, and review checks passed"
